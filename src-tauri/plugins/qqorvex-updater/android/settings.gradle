pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    google()
  }
  resolutionStrategy {
    eachPlugin {
      if (requested.id.id == "com.android.library") useVersion("8.0.2")
      if (requested.id.id == "org.jetbrains.kotlin.android") useVersion("1.8.20")
    }
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories { mavenCentral(); google() }
}

include(":tauri-android")
project(":tauri-android").projectDir = File("./.tauri/tauri-api")
