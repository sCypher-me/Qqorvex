[package]
name = "tauri-plugin-qqorvex-updater"
version = "0.1.0"
description = "Downloader de atualizações Android do Qqorvex com verificação SHA-256"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-qqorvex-updater"

[dependencies]
tauri = { version = "2.11.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = "2.6.3"
