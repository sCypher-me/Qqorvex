project_id = "uowipikbumbaprckdvkg"

[functions.investment-quotes]
# A função consulta somente os ativos da conta autenticada e valida o JWT no servidor.
verify_jwt = true

[functions.invite-user]
verify_jwt = true

[functions.stripe-webhook]
# Stripe autentica este endpoint via Stripe-Signature, validada no handler.
verify_jwt = false

[functions.billing-app-return]
# Endpoint público somente de redirecionamento para o deep link fixo do APK.
verify_jwt = false

[functions.google-calendar-disconnect]
# A revogação sempre deriva o usuário do JWT validado; nunca aceita user_id do cliente.
verify_jwt = true

[functions.send-notifications]
# Chamada pelo pg_cron; autentica pelo header X-Cron-Secret (cron_secret em app_secrets).
verify_jwt = false

[functions.sync-google-calendar]
# Chamada pelo pg_cron; autentica pelo header X-Cron-Secret.
verify_jwt = false

[functions.google-oauth-callback]
# Retorno do consentimento do Google (navegação comum, sem JWT); a segurança vem do `state` de uso único.
verify_jwt = false

[functions.discord-link]
# Início e desconexão dos cargos vinculados; o usuário sempre vem do JWT validado.
verify_jwt = true

[functions.discord-link-callback]
# Retorno do consentimento do Discord (navegação comum, sem JWT); a segurança vem do `state` de uso único.
verify_jwt = false

[functions.discord-roles-sync]
# Chamada pelo pg_cron; autentica pelo header X-Cron-Secret.
verify_jwt = false

[functions.waitlist-join]
# Formulário público do site; protegido por origem, Turnstile no servidor e limite por IP.
verify_jwt = false

# Templates Auth locais. No projeto hospedado, os mesmos HTML/assuntos precisam ser colados
# em Authentication → Email → Templates no Dashboard.
